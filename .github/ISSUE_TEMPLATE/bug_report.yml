name: Bug report
about: Report a reproducible defect without posting secrets
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not disclose vulnerabilities or infrastructure secrets here; see SECURITY.md."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Please include an example with synthetic addresses only.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NixFence version
