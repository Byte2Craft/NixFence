name: Build, scan and publish NixFence Community
on:
  push:
    tags:
      - 'v0.*'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q
  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build candidate locally (do NOT push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: false
          load: true
          tags: nixfence-community:security-candidate
      - name: Block release if Docker Scout detects ANY known CVE
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://nixfence-community:security-candidate
          exit-code: true
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify release tag matches application version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          expected="${REF_NAME#v}"
          actual="$(docker run --rm --entrypoint python nixfence-community:security-candidate -c 'import nixfence; print(nixfence.__version__)')"
          case "$expected:$actual" in
            0.2.0-beta.2:0.2.0b2) ;;
            *) echo "Refusing mismatched or unapproved tag: $expected / $actual" >&2; exit 1 ;;
          esac
      - name: Publish EXACT image that passed the scan
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${REF_NAME#v}"
          docker tag nixfence-community:security-candidate "byte2craft/nixfence-community:${tag}"
          docker push "byte2craft/nixfence-community:${tag}"
