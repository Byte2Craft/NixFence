name: Community CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Static checks
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: Validate application import
        run: python -c 'from nixfence.api import app; print(app.title)'
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build development image (no push)
        run: docker build -t nixfence-ci:preview .
