[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nixfence"
version = "0.1.0a0"
description = "Byte2craft NixFence - open-core Linux host security policy manager (technical preview)"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Byte2craft"}]

keywords = ["linux", "firewall", "selinux", "security", "open-source", "byte2craft"]

dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.urls]
Homepage = "https://byte2craft.com/nixfence/"
Source = "https://github.com/Byte2Craft/NixFence"



[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
